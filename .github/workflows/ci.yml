name: preservation-invariants

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install from declared package metadata
        run: python -m pip install '.[dev]'
      - name: Test software and preservation invariants
        run: pytest
      - name: Compile package
        run: python -m compileall -q src

