---
- name: Install Debian-provenance runtime packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      - rsync
      - aria2
    state: present
    update_cache: true

- name: Create RAB system group
  ansible.builtin.group:
    name: "{{ rab_group }}"
    system: true

- name: Create RAB service account
  ansible.builtin.user:
    name: "{{ rab_user }}"
    group: "{{ rab_group }}"
    system: true
    create_home: false
    home: "{{ rab_root }}"
    shell: /usr/sbin/nologin

- name: Create preservation root
  ansible.builtin.file:
    path: "{{ rab_root }}"
    state: directory
    owner: "{{ rab_user }}"
    group: "{{ rab_group }}"
    mode: "0750"

- name: Install RAB into isolated virtual environment
  ansible.builtin.pip:
    name: "{{ rab_source_dir }}"
    virtualenv: /opt/rab/venv
    virtualenv_command: /usr/bin/python3 -m venv
  notify: Restart RAB audit timer

- name: Create source staging directory
  ansible.builtin.file:
    path: "{{ rab_root }}/source-staging"
    state: directory
    owner: "{{ rab_user }}"
    group: "{{ rab_group }}"
    mode: "0750"

- name: Install explicit source worker template without enabling synchronization
  ansible.builtin.template:
    src: rab-source@.service.j2
    dest: /etc/systemd/system/rab-source@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install fixity audit service
  ansible.builtin.template:
    src: rab-audit.service.j2
    dest: /etc/systemd/system/rab-audit.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install fixity audit timer
  ansible.builtin.copy:
    src: rab-audit.timer
    dest: /etc/systemd/system/rab-audit.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart RAB audit timer

- name: Enable fixity audit timer
  ansible.builtin.systemd_service:
    name: rab-audit.timer
    enabled: true
    state: started
    daemon_reload: true
