---
- name: Install Debian-provenance runtime packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      - rsync
    state: present
    update_cache: true

- name: Install optional Debian aria2 acquisition client
  ansible.builtin.apt:
    name: aria2
    state: present
    update_cache: true
  when: rab_aria2_enabled

- name: Install optional Debian ClamAV command-line scanner
  ansible.builtin.apt:
    name:
      - clamav
      - clamav-freshclam
    state: present
    update_cache: true
  when: rab_clamav_enabled

- name: Apply explicit ClamAV signature updater policy
  ansible.builtin.systemd_service:
    name: clamav-freshclam.service
    enabled: "{{ rab_clamav_freshclam_enabled }}"
    state: "{{ 'started' if rab_clamav_freshclam_enabled else 'stopped' }}"
    daemon_reload: true
  when: rab_clamav_enabled

- name: Create RAB system group
  ansible.builtin.group:
    name: "{{ rab_group }}"
    system: true

- name: Create RAB service account
  ansible.builtin.user:
    name: "{{ rab_user }}"
    group: "{{ rab_group }}"
    system: true
    create_home: false
    home: "{{ rab_root }}"
    shell: /usr/sbin/nologin

- name: Create preservation root
  ansible.builtin.file:
    path: "{{ rab_root }}"
    state: directory
    owner: "{{ rab_user }}"
    group: "{{ rab_group }}"
    mode: "0750"

- name: Create isolated RAB virtual environment
  ansible.builtin.command:
    cmd: /usr/bin/python3 -m venv /opt/rab/venv
    creates: /opt/rab/venv/bin/python

- name: Create deployed RAB source directory
  ansible.builtin.file:
    path: "{{ rab_deploy_dir }}"
    state: directory
    owner: root
    group: "{{ rab_group }}"
    mode: "0750"

- name: Copy RAB source to the Debian appliance
  ansible.builtin.copy:
    src: "{{ rab_source_dir }}/"
    dest: "{{ rab_deploy_dir }}/"
    owner: root
    group: "{{ rab_group }}"
    directory_mode: "0750"

- name: Fingerprint deployed RAB source
  ansible.builtin.stat:
    path: "{{ rab_deploy_dir }}/pyproject.toml"
    checksum_algorithm: sha256
  register: rab_source_manifest

- name: Install RAB into isolated virtual environment once per deployment
  ansible.builtin.command:
    cmd: /opt/rab/venv/bin/pip install "{{ rab_deploy_dir }}"
    creates: "/opt/rab/.rab-installed-{{ rab_source_manifest.stat.checksum }}"
  notify: Restart RAB audit timer

- name: Record RAB installation marker
  ansible.builtin.copy:
    dest: "/opt/rab/.rab-installed-{{ rab_source_manifest.stat.checksum }}"
    content: "installed\n"
    force: false
    mode: "0644"
  notify: Restart RAB audit timer

- name: Create source staging directory
  ansible.builtin.file:
    path: "{{ rab_root }}/source-staging"
    state: directory
    owner: "{{ rab_user }}"
    group: "{{ rab_group }}"
    mode: "0750"

- name: Create disposable consumer state root
  ansible.builtin.file:
    path: "{{ rab_consumer_state_root }}"
    state: directory
    owner: "{{ rab_user }}"
    group: "{{ rab_group }}"
    mode: "0750"

- name: Create explicitly configured consumer workspaces and caches
  ansible.builtin.file:
    path: "{{ rab_consumer_state_root }}/{{ pair[0] }}/{{ pair[1] }}"
    state: directory
    owner: "{{ rab_user }}"
    group: "{{ rab_group }}"
    mode: "0750"
  loop: "{{ rab_consumer_ids | product(['workspaces', 'cache']) | list }}"
  loop_control:
    loop_var: pair

- name: Install explicit source worker template without enabling synchronization
  ansible.builtin.template:
    src: rab-source@.service.j2
    dest: /etc/systemd/system/rab-source@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install fixity audit service
  ansible.builtin.template:
    src: rab-audit.service.j2
    dest: /etc/systemd/system/rab-audit.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install read-only catalogue API service (disabled by default)
  ansible.builtin.template:
    src: rab-api.service.j2
    dest: /etc/systemd/system/rab-api.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install server-rendered web service (disabled by default)
  ansible.builtin.template:
    src: rab-web.service.j2
    dest: /etc/systemd/system/rab-web.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install optional retro HTTP service (disabled by default)
  ansible.builtin.template:
    src: rab-retro-http.service.j2
    dest: /etc/systemd/system/rab-retro-http.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Apply catalogue API service policy
  ansible.builtin.systemd_service:
    name: rab-api.service
    enabled: "{{ rab_api_enabled }}"
    state: "{{ 'started' if rab_api_enabled else 'stopped' }}"
    daemon_reload: true

- name: Apply server-rendered web service policy
  ansible.builtin.systemd_service:
    name: rab-web.service
    enabled: "{{ rab_web_enabled }}"
    state: "{{ 'started' if rab_web_enabled else 'stopped' }}"
    daemon_reload: true

- name: Apply optional retro HTTP service policy
  ansible.builtin.systemd_service:
    name: rab-retro-http.service
    enabled: "{{ rab_retro_http_enabled }}"
    state: "{{ 'started' if rab_retro_http_enabled else 'stopped' }}"
    daemon_reload: true

- name: Install fixity audit timer
  ansible.builtin.copy:
    src: rab-audit.timer
    dest: /etc/systemd/system/rab-audit.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart RAB audit timer

- name: Enable fixity audit timer
  ansible.builtin.systemd_service:
    name: rab-audit.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Install optional authenticated LAN reverse proxy
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
  when: rab_api_lan_enabled

- name: Check optional LAN credentials file
  ansible.builtin.stat:
    path: "{{ rab_api_lan_htpasswd_file }}"
  register: rab_lan_credentials
  when: rab_api_lan_enabled

- name: Refuse LAN profile without operator-supplied credentials
  ansible.builtin.assert:
    that: rab_lan_credentials.stat.exists and rab_lan_credentials.stat.isreg
    fail_msg: "rab_api_lan_enabled requires an operator-created htpasswd file outside Git"
  when: rab_api_lan_enabled

- name: Require the loopback RAB backend for LAN proxying
  ansible.builtin.assert:
    that: rab_api_enabled | bool
    fail_msg: "rab_api_lan_enabled requires rab_api_enabled=true for the loopback backend"
  when: rab_api_lan_enabled

- name: Grant nginx read access to operator-supplied credential hash
  ansible.builtin.file:
    path: "{{ rab_api_lan_htpasswd_file }}"
    owner: root
    group: www-data
    mode: "0640"
  when: rab_api_lan_enabled

- name: Install opt-in LAN API proxy configuration
  ansible.builtin.template:
    src: rab-api-nginx.conf.j2
    dest: /etc/nginx/conf.d/rab-api.conf
    owner: root
    group: root
    mode: "0644"
  when: rab_api_lan_enabled
  notify: Reload RAB LAN proxy

- name: Remove disabled LAN API proxy configuration
  ansible.builtin.file:
    path: /etc/nginx/conf.d/rab-api.conf
    state: absent
  when: not rab_api_lan_enabled
  notify: Reload RAB LAN proxy

- name: Validate optional LAN proxy configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  when: rab_api_lan_enabled

- name: Gather service facts for optional LAN proxy policy
  ansible.builtin.service_facts:

- name: Apply optional LAN proxy service policy
  ansible.builtin.systemd_service:
    name: nginx
    enabled: "{{ rab_api_lan_enabled }}"
    state: "{{ 'started' if rab_api_lan_enabled else 'stopped' }}"
    daemon_reload: true
  when: rab_api_lan_enabled or 'nginx.service' in ansible_facts.services
