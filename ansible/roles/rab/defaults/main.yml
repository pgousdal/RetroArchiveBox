---
rab_user: rab
rab_group: rab
rab_root: /var/lib/rab
rab_source_dir: "{{ playbook_dir }}/.."
rab_deploy_dir: /opt/rab/source
rab_sources_dir: "{{ rab_deploy_dir }}/config/sources"
rab_api_host: 127.0.0.1
rab_api_port: 8000
rab_api_enabled: false
rab_api_lan_enabled: false
rab_api_lan_bind: "127.0.0.1:8081"
rab_api_lan_htpasswd_file: /etc/rab/api.htpasswd
rab_api_lan_realm: "Retro Archive Box"
rab_consumer_state_root: "{{ rab_root }}/consumer-state"
rab_consumer_ids: []
rab_web_host: 127.0.0.1
rab_web_port: 8080
rab_web_enabled: false
rab_retro_http_bind: 127.0.0.1
rab_retro_http_port: 8081
rab_retro_http_enabled: false
rab_avbox_enabled: false
rab_avbox_url: ""
rab_avbox_token_file: /etc/rab/avbox.token
rab_avbox_ca_bundle: ""
rab_avbox_timeout: 15
rab_aria2_enabled: true
rab_inbox_root: "{{ rab_root }}/inbox"
rab_media_root: "{{ rab_root }}/media"
rab_optical_enabled: false
rab_greaseweazle_enabled: false
rab_greaseweazle_version: v1.23
rab_greaseweazle_source: "git+https://github.com/keirf/greaseweazle.git@{{ rab_greaseweazle_version }}"
rab_inbox_watch_enabled: false
rab_inbox_scan_interval_seconds: 30
rab_inbox_stability_seconds: 5
rab_inbox_min_age_seconds: 2
rab_inbox_post_success: LEAVE
