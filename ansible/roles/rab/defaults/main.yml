---
rab_user: rab
rab_group: rab
rab_root: /var/lib/rab
rab_source_dir: "{{ playbook_dir }}/.."
rab_deploy_dir: /opt/rab/source
rab_sources_dir: "{{ rab_deploy_dir }}/config/sources"
rab_api_host: 127.0.0.1
rab_api_port: 8000
rab_api_enabled: false
rab_api_lan_enabled: false
rab_api_lan_bind: "127.0.0.1:8081"
rab_api_lan_htpasswd_file: /etc/rab/api.htpasswd
rab_api_lan_realm: "Retro Archive Box"
rab_consumer_state_root: "{{ rab_root }}/consumer-state"
rab_consumer_ids: []
rab_web_host: 127.0.0.1
rab_web_port: 8080
rab_web_enabled: false
rab_retro_http_bind: 127.0.0.1
rab_retro_http_port: 8081
rab_retro_http_enabled: false
